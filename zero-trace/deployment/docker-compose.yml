services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zerotrace
      POSTGRES_USER: zerotrace
      POSTGRES_PASSWORD: zerotrace
    volumes:
      - zerotrace_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerotrace -d zerotrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://zerotrace:zerotrace@db:5432/zerotrace
      ALLOWED_HOSTS: backend,localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn zerotrace.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    expose:
      - "8000"

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  zerotrace_db:
